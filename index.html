<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Lift Log｜重訓課表</title>
    <link rel="stylesheet" href="styles.css?v=4" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">YOUR TRAINING PLAN</p>
        <div class="title-row"><h1>Lift Log</h1><button id="complete-workout" class="complete-button" type="button">完成運動</button></div>
        <p>打造、調整並帶著你的重訓課表出發。</p>
      </header>

      <nav class="app-tabs" aria-label="功能分頁">
        <button class="app-tab active" data-page="workout" type="button">訓練課表</button>
        <button class="app-tab" data-page="calendar" type="button">月曆記錄</button>
      </nav>
      <section id="workout-page" class="app-page active">
        <nav id="day-tabs" class="day-tabs" aria-label="選擇訓練日"></nav>
        <section id="workout-view" aria-live="polite"></section>
      </section>
      <section id="calendar-page" class="app-page" aria-live="polite"></section>
    </main>

    <dialog id="exercise-dialog" class="exercise-dialog">
      <form id="exercise-form" method="dialog">
        <div class="dialog-head"><div><p class="eyebrow">編輯訓練項目</p><h2 id="dialog-title">新增動作</h2></div><button id="close-exercise" class="icon-button" type="button" aria-label="關閉">×</button></div>
        <label>訓練部位／類型<select id="category" required></select></label>
        <label>器材類型<select id="equipment" required disabled></select></label>
        <label>動作<select id="exercise" disabled></select></label>
        <label>自訂動作名稱（選單沒有時可直接輸入）<input id="custom-exercise" type="text" maxlength="60" placeholder="例如：單手滑輪划船" /></label>
        <div class="number-grid"><label>組數<input id="sets" inputmode="numeric" type="number" min="1" max="12" required /></label><label>每組次數<input id="reps" inputmode="numeric" type="number" min="1" max="100" required /></label></div>
        <p id="selection-note" class="selection-note">請依序選擇部位、器材與動作。</p>
        <div class="dialog-actions"><button id="cancel-exercise" class="secondary-button" type="button">取消</button><button id="save-exercise" class="primary-button" type="submit">儲存動作</button></div>
      </form>
    </dialog>
    <dialog id="day-dialog" class="exercise-dialog">
      <form id="day-form">
        <div class="dialog-head"><div><p class="eyebrow">訓練日設定</p><h2 id="day-dialog-title">編輯訓練日</h2></div><button id="close-day" class="icon-button" type="button" aria-label="關閉">×</button></div>
        <label>日期／項目名稱<input id="day-name" type="text" maxlength="20" placeholder="例如：週六" required /></label>
        <label>訓練內容<input id="day-focus" type="text" maxlength="40" placeholder="例如：腿＋核心" required /></label>
        <div class="dialog-actions split-actions"><button id="delete-day" class="danger-button" type="button">刪除這天</button><span></span><button id="cancel-day" class="secondary-button" type="button">取消</button><button class="primary-button" type="submit">儲存</button></div>
      </form>
    </dialog>
    <dialog id="complete-dialog" class="exercise-dialog">
      <form id="complete-form">
        <div class="dialog-head"><div><p class="eyebrow">保存本次訓練</p><h2>匯入月曆</h2></div><button id="close-complete" class="icon-button" type="button" aria-label="關閉">×</button></div>
        <p class="dialog-copy">選擇要保存到哪一天，可補登先前忘記記錄的訓練。</p>
        <label>訓練日期<input id="complete-date" type="date" required /></label>
        <div id="complete-summary" class="complete-summary"></div>
        <div class="dialog-actions"><button id="cancel-complete" class="secondary-button" type="button">取消</button><button class="primary-button" type="submit">匯入月曆</button></div>
      </form>
    </dialog>
    <template id="exercise-card-template">
      <article class="exercise-card">
        <div class="exercise-main"><button class="expand-button" type="button" aria-expanded="false"><span class="chevron">›</span><span class="exercise-copy"><span class="exercise-tag"></span><strong></strong><small></small></span></button><div class="card-actions"><button class="mini-button edit-button" type="button">編輯</button><button class="mini-button delete-button" type="button" aria-label="刪除動作">×</button></div></div>
        <div class="set-tracker" hidden></div>
      </article>
    </template>
    <script src="app.js?v=4"></script>
  </body>
</html>
